server.port=8080
spring.application.name=pedidos360-productos

# Propiedades de conexión a la base de datos[cite: 1]
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Carga automática de datos de prueba al encender
spring.jpa.defer-datasource-initialization=true

# Conexión a RabbitMQ
spring.rabbitmq.host=172.31.17.5
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Nombres de los recursos AMQP usados por este microservicio
app.rabbitmq.exchange=pedidos.exchange
app.rabbitmq.queue=cola.productos
app.rabbitmq.routingkey=pedido.creado
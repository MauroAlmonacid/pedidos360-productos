server.port=8080
spring.application.name=pedidos360-productos

# Propiedades de conexión a la base de datos[cite: 1]
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Carga automática de datos de prueba al encender
spring.jpa.defer-datasource-initialization=true
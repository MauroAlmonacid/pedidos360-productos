# Puerto en el que escucha este microservicio.
# Se separan los puertos por servicio (8080 vs 8082) para poder ejecutar
# ambos localmente sin colisiones mientras la entrada real la hace AWS API Gateway.
server.port=8080

# Nombre lógico del servicio; lo usa Spring Cloud/AWS para tracing y logging.
spring.application.name=pedidos360-productos